# ============================================================
# mall 开发环境中间件编排
# 用法：
#   docker compose up -d                  # 核心：MySQL + Redis
#   docker compose --profile mq up -d     # 追加 RabbitMQ（下单延迟队列需要）
#   docker compose --profile mongo up -d  # 追加 MongoDB（会员浏览记录需要）
#   docker compose --profile search up -d # 追加 Elasticsearch（mall-search 需要）
#   docker compose --profile minio up -d  # 追加独立 MinIO（不依赖虚拟机里 Milvus 自带的那个）
#   docker compose --profile monitoring up -d # 追加 Prometheus + Grafana（监控 mall-admin）
#   docker compose logs -f mysql          # 看初始化日志
#   docker compose down                   # 停止（保留数据）
#   docker compose down -v                # 停止并清空数据（谨慎）
# ============================================================
name: mall-infra

services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: mall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mall-mysql-data:/var/lib/mysql
      # 首次启动自动执行 mall.sql 建表，无需手工导入
      - ./document/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7
    container_name: mall-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mall-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    profiles: ["mq"]
    image: rabbitmq:3.12-management
    container_name: mall-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-mall}
      TZ: Asia/Shanghai
    volumes:
      - mall-rabbitmq-data:/var/lib/rabbitmq

  mongo:
    profiles: ["mongo"]
    image: mongo:5
    container_name: mall-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mall-mongo-data:/data/db

  elasticsearch:
    profiles: ["search"]
    image: elasticsearch:7.17.10
    container_name: mall-es
    restart: unless-stopped
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - mall-es-data:/usr/share/elasticsearch/data
    # 虚拟机 8G 内存，ES 已限制 512m 堆，仍建议单独启动而非长期常驻

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: mall-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_UI_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - mall-minio-data:/data

  # ============ 可观测性（Prometheus + Grafana） ============
  # 启动：docker compose --profile monitoring up -d
  # Prometheus: http://<VM_IP>:9090   Grafana: http://<VM_IP>:3000 (admin/admin)
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: mall-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mall-prometheus-data:/prometheus
    # 让容器内可以用 host.docker.internal 访问宿主机上跑的 mall-admin
    # 默认 host-gateway 指向 Docker 网关（应用也跑在同一台机器时用）；
    # 如果应用跑在别的机器（例如 Windows 宿主机），在 .env 里把 MALL_HOST_IP 改成该机器 IP
    extra_hosts:
      - "host.docker.internal:${MALL_HOST_IP:-host-gateway}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: mall-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - mall-grafana-data:/var/lib/grafana
      # 数据源与看板随容器启动自动注入，无需手工配置
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mall-mysql-data:
  mall-redis-data:
  mall-rabbitmq-data:
  mall-mongo-data:
  mall-es-data:
  mall-minio-data:
  mall-prometheus-data:
  mall-grafana-data:
