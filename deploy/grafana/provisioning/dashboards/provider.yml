apiVersion: 1

# Grafana 启动时自动加载 dashboards 目录下的看板 JSON
providers:
  - name: 'mall'
    orgId: 1
    folder: 'mall'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
