spring:
  datasource:
    url: jdbc:mysql://192.168.150.101:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    redis:
      host: 192.168.150.101 # Redis服务器地址（虚拟机）
      database: 0 # Redis数据库索引（默认为0）
      port: 6379 # Redis服务器连接端口
      password: # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）
  rabbitmq:
    host: 192.168.150.101 # RabbitMQ（虚拟机）
    port: 5672
    virtual-host: /mall
    username: mall
    password: mall

# 商品变更后是否投递 ES 同步消息；排查问题时置为 false 可快速隔离 MQ
mall:
  es-sync:
    enabled: true

minio:
  endpoint: http://192.168.150.101:9000 #MinIO服务所在地址
  bucketName: mall #存储桶名称
  accessKey: minioadmin #访问的key
  secretKey: minioadmin2026 #访问的秘钥（虚拟机 Milvus MinIO 实际密码）

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false